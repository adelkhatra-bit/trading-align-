name: ALIGN Workflow Watchdog

on:
  # Tous les workflows ALIGN du dépôt, y compris les PR et branches de correction.
  workflow_run:
    workflows:
      - "ALIGN contrôle IA (manuel)"
      - "ALIGN worker rollover"
      - "ALIGN MTF validation"
      - "ALIGN MTF BOT (signaux BTC + Gold + NASDAQ Telegram)"
      - "ALIGN audit des messages envoyés (manuel)"
      - "CI Integration Tests"
      - "ALIGN MetaApi vérification"
      - "ALIGN rejeu entrée sniper (manuel)"
      - "ALIGN Topstep vérification"
      - "pages build and deployment"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: align-workflow-watchdog-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    if: github.repository == 'adelkhatra-bit/trading-align-'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout watchdog from production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Detect failures, retry safe transient validation errors, report blockers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/align_workflow_watchdog.py
