name: ALIGN worker rollover

on:
  workflow_run:
    workflows: ["ALIGN MTF validation"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retire_previous_worker:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Retire older production workers after validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          current_sha = os.environ["CURRENT_SHA"]
          validation_run_id = int(os.environ["VALIDATION_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          if not repo or not current_sha or not token or validation_run_id <= 0:
              raise SystemExit("Rollover preflight failed: repository, validated SHA, or token missing.")

          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ALIGN-worker-rollover"
          }

          def request(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
              return json.loads(raw.decode("utf-8")) if raw else {}

          def older_active_runs():
              data = request("/actions/workflows/align-bot.yml/runs?branch=main&per_page=100")
              runs = data.get("workflow_runs", [])
              active = {"queued", "in_progress", "waiting", "pending", "requested"}
              return [
                  run for run in runs
                  if run.get("name") in {
                    "ALIGN MTF BOT (signaux BTC + Gold Telegram)",
                    "ALIGN MTF BOT (signaux BTC + Gold + NASDAQ Telegram)",
                }
                  and run.get("id", 0) < validation_run_id
                  and run.get("status") in active
              ]

          # Le worker actif termine son tour, sauvegarde state.json puis sort avec succès.
          # Le rollover n'envoie aucune requête API d'arrêt ou d'annulation.
          deadline = time.time() + 900
          while time.time() < deadline:
              pending = sorted(
                  older_active_runs(),
                  key=lambda item: int(item.get("id", 0)),
              )
              if not pending:
                  print("ALIGN_OLD_WORKERS_STOPPED_GRACEFULLY validated_sha=" + current_sha[:12])
                  break

              details = []
              for item in pending:
                  details.append(
                      f"{int(item.get('id', 0))}:{item.get('status', 'unknown')}:"
                      f"{str(item.get('head_sha', ''))[:12]}"
                  )
              print("WAITING_FOR_GRACEFUL_WORKER_EXIT " + ",".join(details), flush=True)
              time.sleep(10)
          else:
              pending = older_active_runs()
              if pending:
                  ids = ",".join(str(int(item.get("id", 0))) for item in pending)
                  raise SystemExit(
                      "Rollover stopped safely: older worker did not exit gracefully; "
                      "no cancellation was sent; active run IDs=" + ids
                  )

          # Vérification finale : aucun worker plus ancien ne doit subsister.
          remaining = older_active_runs()
          if remaining:
              ids = ",".join(str(item["id"]) for item in remaining)
              raise SystemExit("Rollover refused to proceed; older workers are still active: " + ids)
          PY
