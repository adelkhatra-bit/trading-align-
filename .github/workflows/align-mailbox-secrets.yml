name: ALIGN boîte aux lettres — pose du jeton de lecture

# Pose dans le Worker Cloudflare « align-tv-mailbox » le jeton de LECTURE de la boîte aux lettres.
# Le jeton est DÉRIVÉ du secret CLOUDFLARE_API_TOKEN (HMAC-SHA256, même calcul que le bot) :
# personne n'a à le copier, il n'est jamais affiché (masqué dans les journaux).
# Les alertes TradingView n'ont besoin d'AUCUN jeton : /ingest/tradingview n'accepte que les IP
# officielles de TradingView.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/align-tv-mailbox/**"
      - "align-bot/align_tv_mailbox_feeder.py"
      - ".github/workflows/align-mailbox-secrets.yml"

permissions:
  contents: read

concurrency:
  group: align-mailbox-secrets
  cancel-in-progress: false

jobs:
  jeton:
    name: Jeton de lecture du Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ed11eef72824aabb93a8ba301f299ca2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier que le secret Cloudflare existe (sans l'afficher)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ÉCHEC: secret CLOUDFLARE_API_TOKEN absent."; exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN présent."
      - name: Dériver le jeton de lecture (masqué)
        env:
          ALIGN_TOKEN_FILE: ${{ runner.temp }}/align_read_token
        run: python3 align-bot/align_tv_mailbox_feeder.py --print-derived-token-to-github-mask
      - name: Poser le secret ALIGN_TV_MAILBOX_TOKEN dans le Worker
        working-directory: cloud/align-tv-mailbox
        run: |
          npx --yes wrangler@4 secret put ALIGN_TV_MAILBOX_TOKEN < "${{ runner.temp }}/align_read_token"
          rm -f "${{ runner.temp }}/align_read_token"
      - name: Contrôle réel de la boîte aux lettres (sans afficher le jeton)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          sys.path.insert(0, "align-bot")
          import align_tv_mailbox_feeder as f
          jeton = f.jeton_lecture()
          url = f.DEFAULT_MAILBOX_URL
          ua = {"User-Agent": f.USER_AGENT}   # Cloudflare refuse l'agent « Python-urllib » (403)
          sante = json.loads(urllib.request.urlopen(urllib.request.Request(url + "/health", headers=ua), timeout=10).read())
          assert sante.get("ok") and sante.get("source") == "ALIGN_MTF_PRO_V25", sante
          # La propagation d'un secret Worker prend quelques secondes.
          for essai in range(6):
              req = urllib.request.Request(url + "/mailbox?symbol=BTCUSD", headers={"Authorization": "Bearer " + jeton, **ua})
              try:
                  corps = json.loads(urllib.request.urlopen(req, timeout=10).read())
                  print("LECTURE_AUTORISEE", json.dumps({k: corps.get(k) for k in ("ok", "symbol", "error")}))
                  break
              except urllib.error.HTTPError as e:
                  print("tentative", essai + 1, "HTTP", e.code)
                  time.sleep(5)
          else:
              raise SystemExit("ÉCHEC: le Worker refuse encore le jeton de lecture.")
          PY
