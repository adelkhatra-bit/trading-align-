name: ALIGN MTF validation

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "align-bot/**"
      - "scripts/**"
      - "docs/live/**"
      - "cloud/**"
      - ".github/workflows/**"
      - "scripts/align_workflow_watchdog.py"
  # Pas de filtre de chemins sur les PR : « validate » est un contrôle obligatoire
  # de la règle de protection de main ; il doit donc tourner sur toutes les PR.
  pull_request:
    branches:
      - main

concurrency:
  group: align-mtf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q align-bot
      - name: Enforce canonical ALIGN identity and data-only publication branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_align_source_of_truth.py
      - name: Compile human-only ALIGN incident coordinator
        run: python -m py_compile scripts/align_auto_repair.py
      - name: Compile watchdog Python script
        run: python -m py_compile scripts/align_workflow_watchdog.py
      - name: Prepare Node for live overlay validation
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate animated TradingView live overlay JavaScript
        run: node --check docs/live/align-bande-live.user.js
      - name: Test Cloudflare mailbox Worker (anti-mélange des marchés)
        run: node cloud/align-tv-mailbox/test_worker.mjs
      - name: Prepare Go for actionlint
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Validate ALIGN workflow with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/align-bot-validation.yml .github/workflows/align-bot.yml .github/workflows/align-bot-rollover.yml .github/workflows/align-workflow-watchdog.yml .github/workflows/align-auto-repair.yml .github/workflows/align-mailbox-secrets.yml .github/workflows/align-fast-healthcheck.yml .github/workflows/ai-check.yml
      - name: Run targeted auto-repair coordinator tests
        run: python -m unittest discover -s align-bot -p "test_align_auto_repair.py" -v
      - name: Run complete MTF regression suite
        env:
          # Parité Pine <-> bot sur VRAIES bougies Kraken (sauté proprement si le réseau est indisponible)
          ALIGN_PARITE_RESEAU: "1"
        run: python -m unittest discover -s align-bot -p "test_*.py" -v
