name: ALIGN MTF BOT (signaux BTC + Gold + NASDAQ Telegram)
# Release trigger after verified cleanup of the previous production worker.

on:
  # Les pushes sont validés par align-bot-validation.yml. Le worker ne redémarre
  # qu'après la réussite de cette validation, via workflow_run.
  workflow_run:
    workflows: ["ALIGN MTF validation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # uniquement pour publier l'état PUBLIC sur la branche live-data (page ALIGN LIVE)
  models: read
  actions: read    # lire l'état des runs : attendre que l'ancien worker ait fini de sauvegarder sa mémoire

concurrency:
  # Un seul worker de production. Ne jamais annuler le worker actif :
  # il doit terminer son tour et sauvegarder state.json (anti-doublons,
  # abonnements, suivis et offsets Telegram) avant le worker suivant.
  group: align-bot
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/align-bot-validation.yml

  signaux:
    needs: validate
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
         needs.validate.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: align-bot
    steps:
      - uses: actions/checkout@v4
        with:
          # Un événement workflow_run ne doit jamais exécuter le HEAD main non validé :
          # il doit exécuter exactement le commit dont la validation vient de réussir.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: align-bot

      - name: Vérifier le commit validé réellement exécuté
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Worker checkout mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "WORKER_CHECKOUT_SHA=$ACTUAL_SHA"

      - name: Attendre la fin de l'ancien worker (sa sauvegarde de mémoire)
        # Sans cette attente, le nouveau worker restaurait une mémoire PÉRIMÉE (celle de la dernière fin de bloc) pendant que l'ancien
        # sauvegardait encore : envois oubliés (doublons), marchés cochés perdus, suivis de position perdus.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo, me, token = os.environ["REPO"], int(os.environ["RUN_ID"]), os.environ["GH_TOKEN"]
          def autres():
              url = f"https://api.github.com/repos/{repo}/actions/workflows/align-bot.yml/runs?status=in_progress&per_page=20"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return [x["id"] for x in json.loads(r.read().decode()).get("workflow_runs", []) if x["id"] < me]
          debut = time.time()
          while time.time() - debut < 240:
              try:
                  vieux = autres()
              except Exception as ex:
                  print("WORKER_WAIT lecture impossible", type(ex).__name__); break
              if not vieux:
                  print(f"WORKER_WAIT ancien worker terminé après {int(time.time() - debut)} s"); break
              print(f"WORKER_WAIT en attente de {vieux} ({int(time.time() - debut)} s)"); time.sleep(5)
          else:
              print("WORKER_WAIT délai de 240 s atteint : on continue")
          PY

      - name: Récupérer la mémoire du robot
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
          restore-keys: align-etat-

      - name: Contrôler la mémoire restaurée sans afficher d'identifiants
        working-directory: align-bot
        env:
          CACHE_MATCHED_KEY: ${{ steps.restore_state.outputs.cache-matched-key }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "state.json"
          report = {
              "cache_matched_key": os.environ.get("CACHE_MATCHED_KEY", "") or "NONE",
              "state_file_present": os.path.isfile(path),
          }
          if os.path.isfile(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      state = json.load(f)
                  report["state_json_valid"] = isinstance(state, dict)
                  if isinstance(state, dict):
                      report["schema_version"] = state.get("schema_version", state.get("version", "unknown"))
                      report["subscriber_count"] = len(state.get("chats", []))
                      report["prospect_count"] = len(state.get("prospects", []))
                      report["telegram_offset_present"] = state.get("offset") is not None
                      report["btc_open_trade"] = bool((state.get("BTC") or {}).get("trade"))
                      report["gold_open_trade"] = bool((state.get("GOLD") or {}).get("trade"))
                      report["nasdaq_open_trade"] = bool((state.get("NASDAQ") or {}).get("trade"))
                      report["btc_auto_follow_count"] = len((state.get("auto") or {}).get("BTC", []))
                      report["gold_auto_follow_count"] = len((state.get("auto") or {}).get("GOLD", []))
                      report["nasdaq_auto_follow_count"] = len((state.get("auto") or {}).get("NASDAQ", []))
              except Exception as exc:
                  report["state_json_valid"] = False
                  report["parse_error"] = type(exc).__name__
          with open("state-audit.txt", "w", encoding="utf-8") as f:
              for key, value in report.items():
                  f.write(f"{key}={value}\\n")
          for key, value in report.items():
              print(f"ALIGN_STATE_AUDIT {key}={value}")
          PY

      - name: Publier le contrôle mémoire (sans données personnelles)
        uses: actions/upload-artifact@v4
        with:
          name: align-state-audit-${{ github.run_id }}
          path: align-bot/state-audit.txt
          retention-days: 1

      - name: Vérifier la connexion à Telegram sans envoyer de message
        # Un simple délai réseau (read timeout sur getMe, vu aux runs 732-736) ne doit JAMAIS tuer le worker :
        # 3 essais espacés de 15 s (timeout 60 s) ; si Telegram ne répond toujours pas → avertissement seulement,
        # le bot a ses propres reprises réseau. Seul un secret absent ou un refus explicite de l'API reste bloquant.
        working-directory: align-bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          if not token:
              raise SystemExit("ÉCHEC: secret TELEGRAM_TOKEN absent")
          API = "https://api.telegram.org/bot" + token + "/"
          ESSAIS, PAUSE, DELAI = 3, 15, 60

          def appel(methode):
              """Réponse JSON de l'API, ou None si le réseau ne répond pas (délai, coupure, 5xx) après 3 essais."""
              derniere = ""
              for n in range(1, ESSAIS + 1):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(API + methode), timeout=DELAI) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as ex:
                      if ex.code in (401, 403, 404):
                          raise SystemExit(f"ÉCHEC: Telegram refuse le jeton (HTTP {ex.code}) sur {methode}")
                      derniere = f"HTTP {ex.code}"
                  except Exception as ex:                      # TimeoutError, URLError, coupure : transitoire
                      derniere = type(ex).__name__
                  print(f"TELEGRAM_RETRY {methode} essai {n}/{ESSAIS} : {derniere}")
                  if n < ESSAIS:
                      time.sleep(PAUSE)
              return None

          def avertir(texte):
              print("::warning title=Telegram injoignable depuis le runner::" + texte)
              print("TELEGRAM_API_UNREACHABLE le worker démarre quand même (reprises réseau du bot)")
              raise SystemExit(0)

          payload = appel("getMe")
          if payload is None:
              avertir("getMe sans réponse après 3 essais (60 s chacun) : le bot démarre et réessaiera lui-même.")
          if not payload.get("ok"):
              raise SystemExit("ÉCHEC: API Telegram indisponible")
          info = appel("getWebhookInfo")
          if info is None:
              avertir("getWebhookInfo sans réponse : webhook non vérifié, le bot démarre quand même.")
          if not info.get("ok"):
              raise SystemExit("ÉCHEC: impossible de vérifier le mode de réception Telegram")
          webhook = (info.get("result") or {}).get("url", "").strip()
          if webhook:
              deleted = appel("deleteWebhook?drop_pending_updates=false")
              if deleted is None:
                  avertir("deleteWebhook sans réponse : un webhook est actif, le polling peut être bloqué tant qu'il n'est pas retiré.")
              if not deleted.get("ok"):
                  raise SystemExit("ÉCHEC: webhook Telegram actif et suppression impossible; le polling ne peut pas démarrer.")
              print("TELEGRAM_WEBHOOK_REMOVED pending_updates_preserved=true")
              verified = appel("getWebhookInfo")
              if verified is not None and (not verified.get("ok") or (verified.get("result") or {}).get("url", "").strip()):
                  raise SystemExit("ÉCHEC: le webhook Telegram est toujours actif après suppression.")
          print("TELEGRAM_API_OK bot=@" + payload["result"].get("username", "unknown"))
          print("TELEGRAM_RECEIVE_MODE=polling webhook=none")
          print("Aucun message de démarrage envoyé aux utilisateurs.")
          PY

      - name: Vérifier une connexion IA réelle (même chaîne que le bot)
        # Contrôle informatif : si l'IA externe est indisponible, le moteur ALIGN interne continue sans simuler d'avis IA.
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 ai_healthcheck.py

      - name: Vérifier le bridge TradingView ROBOT V12 (BTC + GOLD + NASDAQ)
        # Contrôle bloquant de production : aucune analyse Telegram si le bridge TradingView réel n'est pas raccordé et frais.
        env:
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = os.environ.get("ALIGN_TV_API_URL", "").strip().rstrip("/")
          token = os.environ.get("ALIGN_TV_READ_TOKEN", "").strip()
          if not base or not token:
              raise SystemExit("ÉCHEC: secrets ALIGN_TV_API_URL / ALIGN_TV_READ_TOKEN absents; bridge TradingView obligatoire, analyse Telegram bloquée.")
          for symbol in ("BTCUSD", "XAUUSD", "NAS100"):
              url = base + "/bridge/robot-v12/mtf?symbol=" + urllib.parse.quote(symbol)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "ALIGN-bridge-preflight"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("ok") is not True or not isinstance(payload.get("snapshots"), dict):
                  raise SystemExit("ÉCHEC: réponse bridge invalide pour " + symbol)
              active = str(payload.get("activeTimeframe") or "").upper()
              if payload.get("activeTimeframeFresh") is not True or active not in {"M1", "M5", "M15", "M30", "H1", "H2", "H4", "D1", "W1"}:
                  raise SystemExit("ÉCHEC: aucune unité TradingView active et fraîche pour " + symbol)
              snap = payload["snapshots"].get(active) or {}
              robot = snap.get("robotV12") or {}
              if snap.get("fresh") is not True or not isinstance(robot, dict) or not robot:
                  raise SystemExit("ÉCHEC: snapshot actif frais ou données ROBOT V12 absents pour " + symbol)
              directions = [robot.get(k) for k in ("lecture_1m", "lecture_5m", "lecture_15m", "lecture_60m")]
              if not any(v not in (None, "") for v in directions):
                  raise SystemExit("ÉCHEC: aucune lecture MTF ROBOT V12 exploitable pour " + symbol)
              # Les UT supérieures doivent être présentes et fraîches, sans assimiler une UT à une autre.
              required = ("M5", "M15", "H1", "H4", "D1", "W1")
              snapshots = payload["snapshots"]
              def get_tf(tf):
                  return snapshots.get(tf) or snapshots.get(tf.lower()) or {}
              stale = [tf for tf in required if get_tf(tf).get("fresh") is not True]
              if stale:
                  raise SystemExit("ÉCHEC: snapshots TradingView absents/périmés pour " + symbol + " : " + ",".join(stale))
              print(f"BRIDGE_CONFIRMED symbol={symbol} active={active} age_ms={payload.get('activeTimeframeAgeMs')} received={','.join(payload.get('receivedTimeframes', []))} required_fresh={','.join(required)} fresh_snapshot=true robot_v12=true")
          PY

      - name: Analyse BTC + Gold + NASDAQ et envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_MAX_JOUR: ${{ vars.ANTHROPIC_MAX_JOUR }}
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
          ALIGN_LIVE_SUJET: ${{ secrets.ALIGN_LIVE_SUJET }}
          # Trading automatique (mode TEST tant que AUTO_TRADE / TOPSTEP_REEL ne valent pas 1)
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_COMPTES: ${{ vars.METAAPI_COMPTES }}
          METAAPI_REGION: ${{ vars.METAAPI_REGION }}
          AUTO_TRADE: "0"
          TOPSTEP_USERNAME: ${{ secrets.TOPSTEP_USERNAME }}
          TOPSTEP_API_KEY: ${{ secrets.TOPSTEP_API_KEY }}
          TOPSTEP_COMPTE: ${{ vars.TOPSTEP_COMPTE }}
          TOPSTEP_PLANCHER: ${{ vars.TOPSTEP_PLANCHER }}
          TOPSTEP_REEL: "0"
          DUREE_SEC: "21000"
          PAUSE_SEC: "5"
        run: exec python3 align_bot.py

      - name: Clé unique de sauvegarde de la mémoire
        id: cle_sauvegarde
        if: always()
        run: |
          echo "a=align-etat-${GITHUB_RUN_ID}-a$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "b=align-etat-${GITHUB_RUN_ID}-b$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Sauver la mémoire du robot
        # Un cache GitHub est immuable : l'ancienne clé fixe « align-etat-<run> » était refusée à l'arrêt (« Unable to reserve cache »)
        # et la mémoire était perdue à chaque déploiement. Clés uniques datées ; le restore prend la plus récente (préfixe align-etat-).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: ${{ steps.cle_sauvegarde.outputs.a }}

      - name: Sauver la mémoire du robot (deuxième exemplaire)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: ${{ steps.cle_sauvegarde.outputs.b }}
