name: ALIGN merge gate

# Porte de contrôle : teste la PR sur son SHA exact et signale le résultat.
# Elle ne fusionne JAMAIS. La fusion reste une décision humaine (AGENTS.md).
on:
  pull_request:
    types: [synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: align-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Seulement les PR venant du dépôt lui-même (pas les forks, token en lecture seule).
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilation
        run: python -m py_compile align-bot/*.py
      - name: Suite complète de tests ALIGN
        run: PYTHONPATH=. python -m unittest discover -s align-bot -p 'test_*.py' -q
      - name: Diagnostic en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⛔ Contrôles en échec sur $(git rev-parse --short HEAD). Aucune fusion. Pousse une correction : la porte relancera les tests."
