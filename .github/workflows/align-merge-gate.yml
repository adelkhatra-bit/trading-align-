name: ALIGN merge gate

# Fusionne une PR seulement si : l'étiquette « auto-merge » est posée (accord explicite),
# les tests passent sur le SHA exact de la PR, et la PR n'a pas de conflit.
# En cas d'échec : aucune fusion, commentaire de diagnostic, nouvelle tentative au prochain push.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: align-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge') && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier que la PR est fusionnable
        id: mergeable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq '.mergeable_state')
          echo "mergeable_state=$STATE" >> "$GITHUB_OUTPUT"
          echo "État de fusion : $STATE"
      - name: Tests ALIGN (SHA exact de la PR)
        id: tests
        run: |
          python -m py_compile align-bot/*.py
          cd align-bot && python -m unittest test_align_mtf test_align_pine_bridge_contract test_closed_mtf_safety -q
      - name: Fusionner si tout est vert
        if: steps.tests.outcome == 'success' && steps.mergeable.outputs.mergeable_state == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --match-head-commit ${{ github.event.pull_request.head.sha }}
      - name: Diagnostic si échec
        if: failure() || steps.mergeable.outputs.mergeable_state != 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⛔ Fusion automatique bloquée sur $(git rev-parse --short HEAD) : tests=${{ steps.tests.outcome }}, état=${{ steps.mergeable.outputs.mergeable_state }}. Pousse une correction : la porte relancera les contrôles."
