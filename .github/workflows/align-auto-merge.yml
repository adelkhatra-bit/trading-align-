name: ALIGN fusion automatique contrôlée

# ALIGN: aucune fusion automatique. Toute intégration exige une autorisation humaine explicite.
# Workflow conservé en pause (if: false) pour documenter l'ancien garde-fou sans pouvoir merger.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["ALIGN MTF validation", "CI Integration Tests"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: align-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: ALIGN fusion automatique — désactivée
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Confirmer que le merge automatique est désactivé
        run: echo "Merge automatique désactivé. Autorisation humaine obligatoire."
