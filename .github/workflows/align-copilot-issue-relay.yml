name: ALIGN Copilot Issue Relay

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: align-copilot-issue-relay
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 431 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'adelkhatra-bit' &&
        startsWith(github.event.comment.body, '[CHATGPT → COPILOT]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ALIGN main (read-only workspace)
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Verify relay credentials are configured
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo "::error::GITHUB_TOKEN unavailable"; exit 1; }
          test -n "$COPILOT_GITHUB_TOKEN" || { echo "::error::Missing repository secret COPILOT_GITHUB_TOKEN. Add a fine-grained token with Copilot Requests permission in ALIGN repository Actions secrets."; exit 1; }

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Process one pending ChatGPT task and reply in issue #431
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALIGN_ISSUE_NUMBER: "431"
          ALIGN_ALLOWED_AUTHOR: "adelkhatra-bit"
        run: python3 scripts/align_copilot_issue_relay.py
