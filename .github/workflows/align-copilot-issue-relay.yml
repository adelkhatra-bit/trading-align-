name: ALIGN Copilot Issue Relay

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: align-copilot-issue-relay
  cancel-in-progress: false

jobs:
  relay:
    # Activation ID is checked in Python; keep large snowflake IDs out of expressions.
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event.issue.number == 431 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'adelkhatra-bit' &&
        contains(github.event.comment.body, '[CHATGPT → COPILOT]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ALIGN main (read-only workspace)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate relay Python syntax
        run: python3 -m py_compile scripts/align_copilot_issue_relay.py

      - name: Check for a pending authorized task
        id: pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALIGN_ISSUE_NUMBER: "431"
          ALIGN_ALLOWED_AUTHOR: "adelkhatra-bit"
          ALIGN_RELAY_START_COMMENT_ID: "6962101708"
        run: python3 scripts/align_copilot_issue_relay.py --check-pending

      - name: Verify Copilot credentials only when work is pending
        if: steps.pending.outputs.pending == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -n "$COPILOT_GITHUB_TOKEN" || {
            echo "::error::Missing repository secret COPILOT_GITHUB_TOKEN. Add a user-owned fine-grained token with Copilot Requests permission."
            exit 1
          }

      - name: Install GitHub Copilot CLI only when work is pending
        if: steps.pending.outputs.pending == 'true'
        run: npm install --global @github/copilot

      - name: Process one pending task and reply in issue #431
        if: steps.pending.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALIGN_ISSUE_NUMBER: "431"
          ALIGN_ALLOWED_AUTHOR: "adelkhatra-bit"
          ALIGN_RELAY_START_COMMENT_ID: "6962101708"
        run: python3 scripts/align_copilot_issue_relay.py
